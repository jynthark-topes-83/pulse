<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Pulse overdrive icon</title>
  <desc id="desc">A neon cyber pulse icon with glowing rings, pixel sparks, and an electric core.</desc>
  <defs>
    <radialGradient id="void" cx="50%" cy="40%" r="72%">
      <stop offset="0" stop-color="#2a074b"/>
      <stop offset="0.42" stop-color="#08090b"/>
      <stop offset="1" stop-color="#020006"/>
    </radialGradient>
    <conicGradient id="storm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff36a"/>
      <stop offset="0.25" stop-color="#46ffee"/>
      <stop offset="0.5" stop-color="#ff2bdd"/>
      <stop offset="0.75" stop-color="#8e42ff"/>
      <stop offset="1" stop-color="#fff36a"/>
    </conicGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff36a"/>
      <stop offset="0.35" stop-color="#46ffee" stop-opacity="0.92"/>
      <stop offset="0.72" stop-color="#ff2bdd" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff2bdd" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.95 0 1 0 0 0.1 0 0 1 0 1 0 0 0 0.85 0" result="hot"/>
      <feMerge>
        <feMergeNode in="hot"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#void)"/>
  <path d="M74 128C130 34 286 20 382 74c82 46 82 145 46 206-51 87-170 72-224 130-36 39-90 35-118-4-39-54 13-109 59-133 78-40 141-23 166-70 18-34-10-76-57-81-54-6-88 35-120 66-29 28-80-12-60-60Z" fill="url(#storm)" opacity="0.86" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="158" fill="none" stroke="#fff36a" stroke-opacity="0.24" stroke-width="12"/>
  <circle cx="256" cy="256" r="119" fill="none" stroke="#46ffee" stroke-opacity="0.34" stroke-width="9" stroke-dasharray="32 16"/>
  <circle cx="256" cy="256" r="82" fill="none" stroke="#ff2bdd" stroke-opacity="0.6" stroke-width="12"/>
  <circle cx="256" cy="256" r="122" fill="url(#core)" opacity="0.88"/>
  <path d="M104 273h70l28-65 44 126 38-156 34 95h90" fill="none" stroke="#fff36a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="30" fill="#fff36a" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="12" fill="#05000f"/>

  <g fill="#46ffee" opacity="0.92">
    <rect x="92" y="91" width="18" height="18" rx="4"/>
    <rect x="397" y="119" width="14" height="14" rx="3"/>
    <rect x="382" y="384" width="20" height="20" rx="5"/>
    <rect x="109" y="376" width="14" height="14" rx="3"/>
  </g>
  <g fill="#ff2bdd" opacity="0.82">
    <rect x="139" y="64" width="10" height="10" rx="2"/>
    <rect x="423" y="301" width="12" height="12" rx="2"/>
    <rect x="73" y="305" width="12" height="12" rx="2"/>
    <rect x="319" y="435" width="10" height="10" rx="2"/>
  </g>
</svg>
